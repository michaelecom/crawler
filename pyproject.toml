[project]
name = "webcrawler"
version = "0.1.0"
description = "Enterprise-level web crawler для глубокого анализа структуры веб-сайтов"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
keywords = ["crawler", "spider", "web-scraping", "async", "enterprise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Асинхронная обработка
    "aiohttp>=3.11.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",

    # База данных
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",

    # Парсинг
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # JavaScript рендеринг
    "playwright>=1.50.0",

    # Валидация и конфигурация
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # CLI интерфейс
    "typer>=0.15.0",
    "rich>=13.9.0",
    "click>=8.1.0",

    # Web UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "websockets>=14.1",

    # Экспорт и визуализация
    "networkx>=3.4.0",
    "plotly>=5.24.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.0",

    # Логирование
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",

    # HTTP и прокси
    "aiohttp-proxy>=0.1.2",
    "certifi>=2024.0.0",

    # Утилиты
    "cachetools>=5.5.0",
    "urllib3>=2.2.0",
]

[project.optional-dependencies]
# PostgreSQL поддержка
postgresql = [
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
]

# Распределённый краулинг
distributed = [
    "redis>=5.2.0",
    "celery>=5.4.0",
    "kombu>=5.4.0",
]

# Мониторинг и метрики
monitoring = [
    "prometheus-client>=0.21.0",
    "sentry-sdk>=2.18.0",
]

# Все опциональные зависимости
all = [
    "webcrawler[postgresql,distributed,monitoring]",
]

[project.optional-dependencies.dev]
# Тестирование
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=6.0.0"
pytest-mock = ">=3.14.0"
pytest-benchmark = ">=5.1.0"
pytest-xdist = ">=3.6.0"

# Линтеры и форматтеры
black = ">=24.10.0"
ruff = ">=0.8.0"
mypy = ">=1.13.0"
pre-commit = ">=4.0.0"

# Безопасность
bandit = ">=1.8.0"
safety = ">=3.2.0"

# Документация
sphinx = ">=8.1.0"
sphinx-rtd-theme = ">=3.0.0"
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"

# Типизация для библиотек
types-pyyaml = ">=6.0.0"
types-redis = ">=4.6.0"
types-requests = ">=2.32.0"
types-urllib3 = ">=1.26.0"

[project.scripts]
crawler = "webcrawler.cli.main:app"
webcrawler = "webcrawler.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/webcrawler"
Documentation = "https://webcrawler.readthedocs.io"
Repository = "https://github.com/yourusername/webcrawler"
Issues = "https://github.com/yourusername/webcrawler/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webcrawler"]

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "reportlab.*",
    "networkx.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["webcrawler/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=webcrawler",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["webcrawler"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", "webcrawler/tests"]
skips = ["B101", "B601"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
