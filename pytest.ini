[pytest]
# Pytest конфигурация для Enterprise Web Crawler

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories
testpaths = tests
norecursedirs = .git .tox dist build *.egg venv .venv

# Output
console_output_style = progress
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Warnings
    -W error
    # Coverage
    --cov=webcrawler
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Asyncio
    --asyncio-mode=auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require services)
    performance: Performance/benchmark tests
    slow: Slow running tests (skip by default)
    asyncio: Async tests

# Coverage settings
[coverage:run]
source = webcrawler
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
exclude_lines =
    # Стандартные исключения
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Coverage percentage
fail_under = 80
precision = 2
skip_covered = False
show_missing = True

[coverage:html]
directory = htmlcov
